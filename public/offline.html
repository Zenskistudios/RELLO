<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#302f51" />
  <title>Rello — Offline</title>
  <style>
    body { font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f6f2; color: #20332d; }
    main { max-width: 420px; margin: 24px; text-align: center; }
    .mark { width: 52px; height: 52px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 18px 18px 18px 6px; background: #6861c4; color: white; font-size: 28px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { color: #75837c; line-height: 1.6; }
    button { border: 0; border-radius: 9px; background: #6861c4; color: white; padding: 11px 16px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="mark">✳</div>
    <h1>You’re away from the network</h1>
    <p>Rello will be ready again when your connection returns. Previously loaded pages may still be available.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
